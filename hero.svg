<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
<title id="title">Clearly — full-stack developer</title><desc id="desc">A dark, technical developer banner featuring Clearly and a terminal showing Synccn and clearlygg.com.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b0f17"/><stop offset=".62" stop-color="#090c12"/><stop offset="1" stop-color="#0b1520"/></linearGradient>
  <radialGradient id="glow"><stop offset="0" stop-color="#1469a7" stop-opacity=".32"/><stop offset="1" stop-color="#1469a7" stop-opacity="0"/></radialGradient>
  <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#00a8ff" stop-opacity=".85"/><stop offset="1" stop-color="#00a8ff" stop-opacity=".02"/></linearGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M 32 0 L 0 0 0 32" fill="none" stroke="#91aaca" stroke-width=".5" opacity=".105"/></pattern>
  <filter id="blur"><feGaussianBlur stdDeviation="34"/></filter>
  <clipPath id="clip"><rect width="1200" height="420" rx="22"/></clipPath>
</defs>
<g clip-path="url(#clip)">
  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect width="1200" height="420" fill="url(#grid)"/>
  <ellipse cx="1024" cy="200" rx="400" ry="340" fill="url(#glow)"/>
  <path d="M -10 395 L 675 395" stroke="url(#line)" stroke-width="2"/>
  <path d="M 0 0 L 0 420" stroke="#00a8ff" stroke-width="4" opacity=".8"/>
  <circle cx="1099" cy="334" r="135" fill="none" stroke="#1a557d" stroke-width="1" opacity=".55"/>
  <circle cx="1099" cy="334" r="101" fill="none" stroke="#1a557d" stroke-width="1" stroke-dasharray="6 8" opacity=".4"/>
  <path d="M 1099 176 V 213 M 944 334 H 979 M 1099 454 V 417" stroke="#00a8ff" opacity=".44"/>
  <g fill="#72d5ff" opacity=".65"><circle cx="1099" cy="199" r="3"/><circle cx="969" cy="334" r="3"/><circle cx="1130" cy="233" r="3"/></g>
  <g font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="12" letter-spacing="1.3">
    <circle cx="64" cy="47" r="4" fill="#ea6269"/><circle cx="81" cy="47" r="4" fill="#e4b354"/><circle cx="98" cy="47" r="4" fill="#5ac6a0"/>
    <text x="121" y="51" fill="#8494a9" letter-spacing=".4">~/users/clearly/profile</text>
    <text x="1134" y="51" fill="#5f809b" text-anchor="end">0x01  //  IDENTITY</text>
  </g>
  <line x1="42" y1="72" x2="1158" y2="72" stroke="#223141" stroke-width="1"/>
  <g font-family="'DejaVu Sans Mono', Consolas, monospace">
    <text x="70" y="117" font-size="14" fill="#72cdf9" letter-spacing="2.2">&gt; INITIALIZING DEVELOPER PROFILE_</text>
    <text x="66" y="226" font-family="Inter, 'Arial', sans-serif" font-size="91" font-weight="800" letter-spacing="-5" fill="#f0f6ff">clearly<tspan fill="#00a8ff">.gg</tspan></text>
    <text x="72" y="267" font-size="17" fill="#c4d2e1" letter-spacing="1.2">FULL-STACK DEVELOPER <tspan fill="#496279"> / </tspan> UI ENGINEER</text>
    <text x="71" y="300" font-size="15.5" fill="#8e9eb1" letter-spacing="0">building interfaces, systems &amp; things worth using.</text>
  </g>
  <g font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="12" letter-spacing=".8">
    <rect x="70" y="339" width="132" height="34" rx="7" fill="#11202c" stroke="#25475e"/><circle cx="88" cy="356" r="3.2" fill="#50c8ff"/><text x="101" y="360" fill="#b8dcf1">TYPESCRIPT</text>
    <rect x="212" y="339" width="134" height="34" rx="7" fill="#121c27" stroke="#2a3a4d"/><circle cx="230" cy="356" r="3.2" fill="#57d2bd"/><text x="243" y="360" fill="#b8c9d9">REACT / WEB</text>
    <rect x="356" y="339" width="148" height="34" rx="7" fill="#121c27" stroke="#2a3a4d"/><circle cx="374" cy="356" r="3.2" fill="#e9c27d"/><text x="387" y="360" fill="#b8c9d9">ROBLOX / LUAU</text>
  </g>
  <!-- Terminal window -->
  <g>
    <rect x="763" y="94" width="380" height="263" rx="15" fill="#090e16" stroke="#2a4057" stroke-width="1.2"/>
    <rect x="763" y="94" width="380" height="41" rx="15" fill="#13202e"/>
    <path d="M 763 120 L 763 135 H 1143 V 120" fill="#13202e"/>
    <line x1="763" y1="135" x2="1143" y2="135" stroke="#2a4057"/>
    <circle cx="786" cy="115" r="4" fill="#ec7278"/><circle cx="803" cy="115" r="4" fill="#e4ba65"/><circle cx="820" cy="115" r="4" fill="#66caa5"/>
    <text x="950" y="119" text-anchor="middle" fill="#9bb0c5" font-family="'DejaVu Sans Mono',monospace" font-size="11.5">terminal — zsh</text>
    <text x="1119" y="119" text-anchor="end" fill="#6b8398" font-family="'DejaVu Sans Mono',monospace" font-size="11">⌘ ↗</text>
    <g font-family="'DejaVu Sans Mono',Consolas,monospace" font-size="14">
      <text x="790" y="171" fill="#4ee0be">➜ <tspan fill="#8fbed8">~</tspan> <tspan fill="#e4effa">whoami</tspan></text>
      <text x="790" y="195" fill="#8fa6bb">clearly <tspan fill="#54718b">// self-taught developer</tspan></text>
      <text x="790" y="228" fill="#4ee0be">➜ <tspan fill="#8fbed8">~</tspan> <tspan fill="#e4effa">ls ./projects</tspan></text>
      <text x="790" y="252" fill="#50c8ff">synccn.com <tspan fill="#516d84">↗</tspan></text>
      <text x="790" y="274" fill="#b5cfdf">clearlygg.com <tspan fill="#516d84">↗</tspan></text>
      <text x="790" y="309" fill="#4ee0be">➜ <tspan fill="#8fbed8">~</tspan> <tspan fill="#e4effa">echo $STATUS</tspan></text>
      <text x="790" y="335" fill="#8fb9d1">always building<tspan fill="#00a8ff">_</tspan></text>
    </g>
  </g>
  <text x="1136" y="399" text-anchor="end" font-family="'DejaVu Sans Mono',monospace" font-size="10" letter-spacing="1.5" fill="#4e6980">PERSONAL SITE / ENGINEERING / OPEN SOURCE</text>
</g>
<rect x=".8" y=".8" width="1198.4" height="418.4" rx="21" fill="none" stroke="#293b4d" stroke-width="1.6"/>
</svg>